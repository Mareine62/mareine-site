<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Honorius Services | Création de sites web au Bénin</title>

    <style>
        * {
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            color: #222;
        }

        nav {
            background: #6c2bd9;
            padding: 16px 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .hero {
            background: white;
            text-align: center;
            padding: 90px 20px;
        }

        .hero h1 {
            color: #6c2bd9;
            font-size: 44px;
            margin-bottom: 10px;
        }

        .hero h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 700px;
            margin: auto;
            font-size: 18px;
            line-height: 1.7;
        }

        .bouton {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 25px;
            border-radius: 30px;
            background: #25D366;
            color: white;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        section {
            max-width: 950px;
            margin: auto;
            padding: 65px 20px;
            text-align: center;
        }

        section h2 {
            color: #6c2bd9;
            font-size: 30px;
            margin-bottom: 30px;
        }

        section p {
            font-size: 17px;
            line-height: 1.7;
        }

        .cartes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .carte {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #ddd;
        }

        .carte h3 {
            color: #6c2bd9;
        }

        .prix {
            font-size: 21px;
            font-weight: bold;
            margin: 20px 0;
        }

        .realisation {
            background: white;
            padding: 25px;
            margin: 15px auto;
            border-radius: 15px;
            max-width: 700px;
            box-shadow: 0 4px 12px #ddd;
        }

        .avantage {
            background: white;
            padding: 20px;
            margin: 12px auto;
            border-radius: 12px;
            max-width: 700px;
        }

        .whatsapp-fixe {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #25D366;
            color: white;
            padding: 15px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 12px #999;
            z-index: 2000;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        @media (max-width: 700px) {

            .hero h1 {
                font-size: 32px;
            }

            .hero h2 {
                font-size: 20px;
            }

            .cartes {
                grid-template-columns: 1fr;
            }

            nav a {
                margin: 0 4px;
                font-size: 12px;
            }
        }
    </style>

</head>

<body>

    <!-- MENU -->
    <nav>

        <a href="#contact">Contact</a>
    </nav>
