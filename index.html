<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mareine - Création de sites web</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 0;
            color: #333;
        }

        nav {
            background-color: #6c2bd9;
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        header {
            padding: 60px 20px;
            background-color: white;
        }

        h1 {
            color: #6c2bd9;
            font-size: 38px;
        }

        h2 {
            color: #6c2bd9;
            margin-top: 40px;
        }

        h3 {
            color: #333;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .bouton {
            display: inline-block;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
        }

        .bouton:hover {
            background-color: #1ebe5d;
        }

        section {
            padding: 30px 20px;
            max-width: 800px;
            margin: auto;
        }

        .service {
            background-color: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 15px;
            box-shadow: 0 3px 10px #cccccc;
            font-size: 18px;
        }

        footer {
            background-color: #222;
            color: white;
            padding: 20px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }

            nav a {
                margin: 0 5px;
                font-size: 14px;
            }

            section {
                padding: 20px 15px;
            }
        }
    </style>

</head>

<body>

    <nav>
        <a href="#accueil">Accueil</a>
        <a href="#apropos">À propos</a>
        <a href="#services">Services</a>
        <a href="#offres">Offres</a>
        <a href="#contact">Contact</a>
    </nav>

    <header id="accueil">
        <h1>
